<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro Plus Bluetooth test</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.45 system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 720px; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    button { font: inherit; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    #status { font-weight: 600; margin: 16px 0 8px; }
    ol { padding: 0; list-style: none; font-size: .92rem; overflow-wrap: anywhere; }
    li { padding: 3px 0; }
    .ok::before { content: '✓ '; color: #2a8f4e; }
    .bad { color: #c8372d; font-weight: 600; }
    .bad::before { content: '✗ '; }
  </style>
</head>
<body>
  <h1>Micro Plus Bluetooth test</h1>
  <p>Close anything else connected to the amp, then press the button and choose your Micro Plus.
    The test takes about <span id="minutes">11</span> minutes. It rewrites preset 100 with its own contents, then returns to the preset you're on.</p>
  <button id="start" type="button">Connect and start the test</button>
  <p id="status" role="status"></p>
  <ol id="log"></ol>
  <script type="module" src="./main.ts"></script>
</body>
</html>
